name: Weiliao
options:
  bundleIdPrefix: cn.yinghemingyu
  deploymentTarget:
    iOS: "14.0"
  createIntermediateGroups: true
  xcodeVersion: "15.4"
  # 生成工程后自动把 Xcode16 格式降级为 Xcode14/15 可读格式（云端运行器为 Xcode 15.4）
  postGenCommand: bash scripts/fix_project_format.sh

targets:
  Weiliao:
    type: application
    platform: iOS
    sources:
      - Weiliao
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.yinghemingyu.weiliao
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGN_STYLE: Manual
    info:
      path: Weiliao/Info.plist
      properties:
        CFBundleDisplayName: 微聊
        CFBundleName: Weiliao
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
