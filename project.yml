name: Weiliao
options:
  bundleIdPrefix: cn.yinghemingyu
  deploymentTarget:
    iOS: "14.0"
  createIntermediateGroups: true
  # 固定工程文件格式，兼容 Xcode 14/15 的编译环境（新版 xcodegen 默认生成 Xcode16 格式会导致云端编译失败）
  objectVersion: 56
  xcodeVersion: "15.4"

targets:
  Weiliao:
    type: application
    platform: iOS
    sources:
      - Weiliao
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.yinghemingyu.weiliao
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGN_STYLE: Manual
    info:
      path: Weiliao/Info.plist
      properties:
        CFBundleDisplayName: 微聊
        CFBundleName: Weiliao
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
