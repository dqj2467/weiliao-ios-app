name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive (unsigned)
        run: |
          xcodebuild archive \
            -project Weiliao.xcodeproj \
            -scheme Weiliao \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/Weiliao.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -r build/Weiliao.xcarchive/Products/Applications/Weiliao.app build/Payload/
          cd build
          zip -r Weiliao-unsigned.ipa Payload
          ls -lh Weiliao-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Weiliao-unsigned-ipa
          path: build/Weiliao-unsigned.ipa

